<!doctype html><html lang="en"><meta charset="utf-8"><title>SGNL render contract verification</title>
<style>body{font:16px/1.5 system-ui;background:#151812;color:#ecf0e5;margin:24px}button{padding:12px 20px}pre{white-space:pre-wrap}canvas{width:320px;max-width:100%;border:1px solid #59634c}</style>
<h1>SGNL · render contract</h1><p>Production renderer, immutable fixtures, actual canvas pixels. This page does not modify Studio or saved recipes.</p><button id="start">Run renderer checks</button><p id="status" role="status">Ready</p><canvas id="preview"></canvas><pre id="results"></pre>
<script type="module">
import { renderStudioFrame } from '/src/engine/renderer.ts';
import { normalizeStudioState } from '/src/engine/studioState.ts';
import { DEFAULT_BASE_CANVAS } from '/src/engine/types.ts';
import { BUILTIN_RECIPES } from '/src/engine/recipes.ts';
const image=new Image();image.src='/samples/colosseum-rome.jpg';
const results=[];
function fixture(){const s=normalizeStudioState(structuredClone(BUILTIN_RECIPES[0].state));s.baseCanvas={...DEFAULT_BASE_CANVAS,mode:'full',glyphFamily:'density',color:'sampled',cellSize:10,knockoutOpacity:.92,paletteModified:false};s.regions=[];s.grading={...s.grading,warpMode:'off',warpIntensity:0};s.tracking={...s.tracking,enabled:false};s.glitch={...s.glitch,enabled:false};s.crt={...s.crt,motionMode:'off',phosphorGlow:0,wholeBloom:0,prismAberration:0,scanlines:0,apertureMask:0,barrelCurve:0,vignette:0,filmGrain:0,dustSpec:0,hologramGhost:0,lights:[],cursorEffect:'off',textOverlay:undefined};return s;}
function render(state,time=0,extra={},width=320){const c=document.createElement('canvas');c.width=width;c.height=Math.round(width*image.naturalHeight/image.naturalWidth);const ctx=c.getContext('2d',{willReadFrequently:true});renderStudioFrame(ctx,image,state,{intent:'animate',time,scale:width/1000,...extra});return {canvas:c,data:ctx.getImageData(0,0,c.width,c.height).data};}
function diff(a,b){let sum=0,count=0;for(let i=0;i<a.length;i+=4){let max=0;for(let j=0;j<4;j++){const d=Math.abs(a[i+j]-b[i+j]);sum+=d;max=Math.max(max,d);}if(max>5)count++;}return{mae:sum/a.length,changedOver5Pct:count/(a.length/4)*100};}
function check(name,a,b,expectedSame){const d=diff(a.data,b.data);const same=d.mae<.01&&d.changedOver5Pct<.01;results.push({name,passed:same===expectedSame,expected:expectedSame?'same':'changed',...d});return b;}
document.querySelector('#start').onclick=async()=>{results.length=0;await image.decode();await document.fonts.ready;
const busy=fixture();busy.crt={...busy.crt,motionMode:'parallax',motionAmount:80,filmGrain:25,dustSpec:15};busy.grading={...busy.grading,warpMode:'wave',warpIntensity:65};busy.tracking={...busy.tracking,enabled:true,intensity:60,autoRoll:true,lineJitter:40,dropouts:30};busy.glitch={...busy.glitch,enabled:true,sliceFrequency:65,maxDisplacement:50,rgbSplit:30,databendChunks:20};
check('Image remains static with all temporal families configured',render(busy,.1,{intent:'image'}),render(busy,2.7,{intent:'image'}),true);
check('Animate moves when temporal families are active',render(busy,.1),render(busy,2.7),false);
check('Animation master bypass freezes every family',render(busy,.1,{animationEnabled:false}),render(busy,2.7,{animationEnabled:false}),true);
for(const channel of ['distortion','tracking','glitch','textures']){const s=fixture();s.animation.channels={[channel]:false};if(channel==='distortion')s.grading={...s.grading,warpMode:'wave',warpIntensity:65};if(channel==='tracking')s.tracking={...s.tracking,enabled:true,intensity:60,autoRoll:true,lineJitter:40,dropouts:30};if(channel==='glitch')s.glitch={...s.glitch,enabled:true,sliceFrequency:65,maxDisplacement:50,rgbSplit:30,databendChunks:20};if(channel==='textures')s.crt={...s.crt,filmGrain:25,dustSpec:15};check(channel+' channel bypass freezes its appearance',render(s,.1),render(s,2.7),true);}
for(const width of [640,1000,1280,2048])for(const mode of ['reveal','trail']){const s=fixture();s.crt={...s.crt,cursorEffect:mode,hoverRadius:30,hoverStrength:80};check(mode+' works at '+width+'px',render(s,0,{},width),render(s,0,{cursor:{active:true,x:.5,y:.5}},width),false);}
for(const mode of ['reveal','trail','loupe','repel','dissolve','water','vortex','magnetic','scatter']){const s=fixture();s.crt={...s.crt,cursorEffect:mode,hoverRadius:30,hoverStrength:0};check(mode+' strength zero is a true bypass',render(s),render(s,0,{cursor:{active:true,x:.5,y:.5}}),true);}
const duo=fixture();duo.baseCanvas.substrateMode='duotone';duo.baseCanvas.knockoutOpacity=0;const d0=render(duo);duo.baseCanvas.knockoutOpacity=.5;const d50=render(duo);duo.baseCanvas.knockoutOpacity=1;const d100=render(duo);check('Duotone 0 to 50 changes the actual substrate',d0,d50,false);check('Duotone 50 to 100 changes the actual substrate',d50,d100,false);
const sort=fixture();sort.glitch={...sort.glitch,enabled:true,sliceFrequency:0,maxDisplacement:0,rgbSplit:0,databendChunks:0,pixelSortEnabled:true,pixelSortStrength:0};const sort0=render(sort);sort.glitch.pixelSortEnabled=false;check('Pixel Sort strength zero matches disabled sorting',sort0,render(sort),true);
const text=fixture();const noText=render(text);text.crt.textOverlay={enabled:true,text:'',subtext:'SUBTITLE WITHOUT TITLE',x:.5,y:.5,size:64,color:'#FFFFFF',layerOrder:'front',fontStyle:'editorial-mono'};check('Subtitle-only poster text is rendered',noText,render(text),false);
text.crt.textOverlay={...text.crt.textOverlay,text:'LONGTITLEWITHOUTSPACES0123456789'.repeat(4),subtext:'LONG SUBTITLE THAT WRAPS WITHIN THE IMAGE',x:0,y:1,size:160};const result=check('Long edge-positioned poster text is rendered',noText,render(text),false);const preview=document.querySelector('#preview');preview.width=result.canvas.width;preview.height=result.canvas.height;preview.getContext('2d').drawImage(result.canvas,0,0);
document.querySelector('#results').textContent=JSON.stringify({passed:results.filter(r=>r.passed).length,total:results.length,results},null,2);document.querySelector('#status').textContent=results.every(r=>r.passed)?'PASS: '+results.length+' renderer checks':'FAIL: inspect results';};
</script></html>
